<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#0a57ff;--o:#ff8c1a;--ink:#0a0a0a;--mu:#3a3a3c;--line:#e6e9ef;--soft:#f5f5f7}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:22px 24px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none}.logo span{color:var(--b)}
.ver{font-size:11px;color:#8e8e93}
.hero{max-width:1100px;margin:0 auto;padding:30px 24px 70px;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--b);background:#eaf0ff;border-radius:999px;padding:7px 14px;margin-bottom:22px}
h1{font-size:clamp(30px,3.9vw,50px);line-height:1.06;letter-spacing:-.04em;font-weight:800;white-space:nowrap}
.sub,.card p,.q p,.steps p,.note{text-wrap:pretty}
.acc{color:var(--o)}
.sub{font-size:20px;font-weight:600;color:var(--mu);margin-top:20px;max-width:40ch;text-wrap:balance}
form{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
input{font:inherit;font-size:16px;padding:15px 16px;border:1.5px solid #d7dce6;border-radius:12px;outline:0;width:100%}
input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(10,87,255,.12)}
input{grid-column:1/-1}
button{grid-column:1/-1;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--o);border:0;border-radius:12px;padding:17px;cursor:pointer}
button:hover{background:#ef7a05}
.note{font-size:14px;color:#6e6e73;margin-top:12px}
.ok{display:none;margin-top:30px;max-width:520px;background:#e8f7ee;border-radius:14px;padding:20px 22px;font-size:16px}
.ok b{display:block;font-size:19px;margin-bottom:6px}
.ok a{display:inline-block;margin-top:12px;background:var(--b);color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:10px}
.photo{position:relative}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 20%;border-radius:26px;display:block}
.badge{position:absolute;left:-18px;bottom:28px;background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 14px 34px rgba(10,20,50,.14);max-width:300px;font-size:14px}
.badge b{display:block;font-size:15px}
.stars{color:#ffb340;letter-spacing:2px;font-size:15px}
.sec{padding:80px 24px}.gray{background:var(--soft)}
.in{max-width:1100px;margin:0 auto}
h2{font-size:clamp(28px,3.4vw,42px);letter-spacing:-.035em;line-height:1.08;font-weight:800}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
.card .n{width:40px;height:40px;border-radius:11px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:18px}
.card:nth-child(2) .n{background:var(--o)}
.card h3{font-size:21px;letter-spacing:-.02em}
.card p{font-size:16px;color:var(--mu);margin-top:8px}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.q{background:#fff;border-radius:20px;padding:28px;border:1px solid var(--line)}
.q p{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.45}
.q span{display:block;margin-top:14px;font-size:14px;color:#6e6e73}.q span b{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;counter-reset:s}
.steps div{border-top:3px solid var(--b);padding-top:18px}
.steps b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--b)}
.steps h3{font-size:20px;margin-top:6px}.steps p{font-size:15px;color:var(--mu);margin-top:6px}
.cta{text-align:center}.cta .sub{margin:16px auto 0;max-width:none}
.cta a{display:inline-block;margin-top:28px;background:var(--o);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:17px 30px;border-radius:12px}
.foot{border-top:1px solid var(--line);padding:26px 24px;font-size:13px;color:#6e6e73;text-align:center}
.foot a{color:#6e6e73;margin:0 8px}
@media(max-width:860px){h1{white-space:normal}.hero{grid-template-columns:1fr;gap:34px;padding-top:10px}.photo{order:-1}.photo img{aspect-ratio:4/3}.badge{left:12px;bottom:12px}.three,.quotes,.steps{grid-template-columns:1fr}form{grid-template-columns:1fr}.sec{padding:60px 20px}}

.form2{max-width:520px;margin:30px auto 0}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.who div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;font-size:16px;color:var(--mu)}
.who b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.founder{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center}
.founder img{width:260px;height:260px;object-fit:cover;object-position:center 20%;border-radius:24px}
.founder p{font-size:19px;color:var(--mu);margin-top:12px;max-width:52ch;text-wrap:pretty}
.ctr{text-align:center}.ctr .sub{margin-left:auto;margin-right:auto}
@media(max-width:860px){.who{grid-template-columns:1fr}.founder{grid-template-columns:1fr;text-align:center}.founder img{margin:0 auto;width:200px;height:200px}.founder p{margin-left:auto;margin-right:auto}}

.box{max-width:620px;margin:60px auto;padding:0 24px;text-align:center}
.check{width:64px;height:64px;border-radius:50%;background:#e8f7ee;color:#1a7f43;font-size:30px;display:grid;place-items:center;margin:0 auto 24px}
.box h1{white-space:normal}
.box a.btn{display:inline-block;margin-top:26px;background:var(--b);color:#fff;text-decoration:none;font-weight:700;padding:15px 24px;border-radius:12px}
</style></head>
<body data-thanks-version="v1">
<div class="top"><span class="logo">BizColab<span>.</span></span><span class="ver">Thanks &middot; v1</span></div>
<div class="box">
  <div class="check">&#10003;</div>
  <h1>You&rsquo;re in the queue<span id="nm"></span>.</h1>
  <p class="sub" style="margin:18px auto 0">I&rsquo;ll reach out within one business day.</p>
  <p class="note">Want to skip ahead? Grab a 15-minute call now.</p>
  <a class="btn" href="https://calendar.app.google/U7KZjhPkYHz8b4JN9" target="_blank" rel="noopener">Book a 15-minute call &rarr;</a>
  <p class="note" style="margin-top:28px">&mdash; Michael</p>
</div>
<div class="foot"><a href="https://bizcolab.com/privacy/">Privacy policy</a></div>
<script>
(function(){
  var q=new URLSearchParams(location.search), src=q.get('src')||'unknown', n=q.get('n');
  if(n) document.getElementById('nm').textContent=', '+n.replace(/[<>]/g,'');
  window.dataLayer=window.dataLayer||[];
  window.dataLayer.push({event:'lead_submit',form_source:'lp_'+src,lead_value:25,currency:'USD'});
  try{gtag('event','generate_lead',{value:25,currency:'USD',form_source:'lp_'+src,ab_variant:'lp_'+src});}catch(e){}
})();
</script>
</body></html>
