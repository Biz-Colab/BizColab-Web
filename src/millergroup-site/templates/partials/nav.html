<div class="bar"><div class="wrap">
  <a class="logo" href="{{ '/' | url }}">{{ site.brand.short }}<i>.</i></a>
  <nav class="nav">
    {% for n in site.nav %}<a href="{{ n.href | url }}"{% if page.path.startswith(n.href) %} aria-current="page"{% endif %}>{{ n.label }}</a>
    {% endfor %}<a href="{{ site.nav_cta.href | url }}" class="cta">{{ site.nav_cta.label }}</a>
  </nav>
  <button class="navtog" type="button" aria-expanded="false" aria-label="Menu">Menu</button>
</div></div>
