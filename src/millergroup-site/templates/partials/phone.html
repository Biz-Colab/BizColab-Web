{# usage: {% with v={'id':..., 'title':..., 'caption':...} %} — YouTube short framed as a phone #}
<a class="fr" href="https://www.youtube.com/shorts/{{ v.id }}" target="_blank" rel="noopener"><img loading="lazy" decoding="async" src="https://i.ytimg.com/vi/{{ v.id }}/oardefault.jpg" onload="if(this.naturalWidth<200){this.onload=null;this.src='https://i.ytimg.com/vi/{{ v.id }}/hqdefault.jpg'}" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/{{ v.id }}/hqdefault.jpg'" alt="{{ v.title }}"><span class="play"><svg width="20" height="20" viewBox="0 0 20 20" fill="#fff"><path d="M4 2l14 8-14 8z"/></svg></span><span class="yt">Watch on YouTube</span></a><p>{{ v.caption }}</p>
