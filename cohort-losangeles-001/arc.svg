<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950" font-family="Geist, system-ui, -apple-system, sans-serif"><defs><linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0071e3"/><stop offset="34%" stop-color="#5e5ce6"/><stop offset="67%" stop-color="#ff6f5e"/><stop offset="100%" stop-color="#30d158"/></linearGradient><radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0%" stop-color="#1e3a5f" stop-opacity=".55"/><stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="950" fill="#0a0a0a"/><rect width="1600" height="520" fill="url(#glow)"/><circle cx="66" cy="52" r="6" fill="#fff"/><text x="82" y="58" font-size="21" font-weight="700" letter-spacing="-.8" fill="#fff">BizColab</text><text x="1540" y="58" font-size="14" fill="rgba(255,255,255,.42)" text-anchor="end">bizcolab.com/cohort-losangeles-001</text><text x="60" y="140" font-size="56" font-weight="700" letter-spacing="-2.6" fill="#fff">The Cohort 01 <tspan font-family="Instrument Serif, Georgia, serif" font-style="italic" font-weight="400" letter-spacing="-1" fill="#ffb340">Arc</tspan></text><text x="60" y="182" font-size="17" fill="rgba(255,255,255,.55)">Four Mondays &#183; 5:30&#8211;7:00 PM PT &#183; Aug 17 &#8211; Sep 7, 2026 &#183; Eight operators, one challenge each</text><rect x="60" y="252" width="1480" height="3" rx="1.5" fill="url(#rail)" opacity=".45"/><circle cx="78" cy="253" r="9" fill="#0071e3"/><circle cx="78" cy="253" r="14" fill="none" stroke="#0071e3" stroke-opacity=".28" stroke-width="2"/><text x="102" y="258" font-size="12" font-weight="700" letter-spacing="1.8" fill="#0071e3">MON AUG 17</text><rect x="60" y="300" width="352" height="600" rx="22" fill="#141416" stroke="rgba(255,255,255,.09)"/><text x="86" y="342" font-size="11.5" font-weight="700" letter-spacing="2" fill="#0071e3">WEEK 1 &#183; MAP</text><text x="86" y="388" font-size="36" font-weight="700" letter-spacing="-1.6" fill="#fff">Intros</text><rect x="86" y="410" width="300" height="1" fill="rgba(255,255,255,.1)"/><text x="86" y="442" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">GOAL</text><text x="86" y="468" font-size="15.5" fill="#fff">Every operator leaves with one</text><text x="86" y="491" font-size="15.5" fill="#fff">named, measurable challenge.</text><text x="86" y="536" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">OBJECTIVES</text><circle cx="89" cy="557" r="2.6" fill="#0071e3" opacity=".85"/><text x="102" y="562" font-size="13.5" fill="rgba(255,255,255,.66)">Five minutes each: what you do,</text><text x="102" y="581" font-size="13.5" fill="rgba(255,255,255,.66)">what you offer, where you need help</text><circle cx="89" cy="605" r="2.6" fill="#0071e3" opacity=".85"/><text x="102" y="610" font-size="13.5" fill="rgba(255,255,255,.66)">Map every offer in the room</text><text x="102" y="629" font-size="13.5" fill="rgba(255,255,255,.66)">against every need</text><circle cx="89" cy="653" r="2.6" fill="#0071e3" opacity=".85"/><text x="102" y="658" font-size="13.5" fill="rgba(255,255,255,.66)">Commit out loud to one</text><text x="102" y="677" font-size="13.5" fill="rgba(255,255,255,.66)">From X &#8594; Y challenge</text><rect x="86" y="726" width="300" height="146" rx="14" fill="rgba(255,255,255,.045)"/><rect x="86" y="726" width="3" height="146" rx="1.5" fill="#0071e3"/><text x="104" y="754" font-size="10.5" font-weight="700" letter-spacing="2" fill="#0071e3">PREP</text><text x="104" y="778" font-size="13" fill="rgba(255,255,255,.72)">Submit your profile form.</text><text x="104" y="798" font-size="13" fill="rgba(255,255,255,.72)">Work the challenge worksheet.</text><text x="104" y="818" font-size="13" fill="rgba(255,255,255,.72)">Rehearse your five minutes once,</text><text x="104" y="838" font-size="13" fill="rgba(255,255,255,.72)">out loud.</text><circle cx="454" cy="253" r="9" fill="#5e5ce6"/><circle cx="454" cy="253" r="14" fill="none" stroke="#5e5ce6" stroke-opacity=".28" stroke-width="2"/><text x="478" y="258" font-size="12" font-weight="700" letter-spacing="1.8" fill="#5e5ce6">MON AUG 24</text><rect x="436" y="300" width="352" height="600" rx="22" fill="#141416" stroke="rgba(255,255,255,.09)"/><text x="462" y="342" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5e5ce6">WEEK 2 &#183; MATCH</text><text x="462" y="388" font-size="36" font-weight="700" letter-spacing="-1.6" fill="#fff">Pairings</text><rect x="462" y="410" width="300" height="1" fill="rgba(255,255,255,.1)"/><text x="462" y="442" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">GOAL</text><text x="462" y="468" font-size="15.5" fill="#fff">Turn the room's experience into</text><text x="462" y="491" font-size="15.5" fill="#fff">a plan for your challenge.</text><text x="462" y="536" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">OBJECTIVES</text><circle cx="465" cy="557" r="2.6" fill="#5e5ce6" opacity=".85"/><text x="478" y="562" font-size="13.5" fill="rgba(255,255,255,.66)">Guest operator: 10 minutes,</text><text x="478" y="581" font-size="13.5" fill="rgba(255,255,255,.66)">then 10 minutes of Q&#38;A</text><circle cx="465" cy="605" r="2.6" fill="#5e5ce6" opacity=".85"/><text x="478" y="610" font-size="13.5" fill="rgba(255,255,255,.66)">Get paired with the operator</text><text x="478" y="629" font-size="13.5" fill="rgba(255,255,255,.66)">whose strength hits your gap</text><circle cx="465" cy="653" r="2.6" fill="#5e5ce6" opacity=".85"/><text x="478" y="658" font-size="13.5" fill="rgba(255,255,255,.66)">Pressure-test two or three</text><text x="478" y="677" font-size="13.5" fill="rgba(255,255,255,.66)">members' plans as a group</text><rect x="462" y="726" width="300" height="146" rx="14" fill="rgba(255,255,255,.045)"/><rect x="462" y="726" width="3" height="146" rx="1.5" fill="#5e5ce6"/><text x="480" y="754" font-size="10.5" font-weight="700" letter-spacing="2" fill="#5e5ce6">PREP</text><text x="480" y="778" font-size="13" fill="rgba(255,255,255,.72)">Ship your Week 1 move.</text><text x="480" y="798" font-size="13" fill="rgba(255,255,255,.72)">File Friday's ship report.</text><text x="480" y="818" font-size="13" fill="rgba(255,255,255,.72)">Bring one question for the guest</text><text x="480" y="838" font-size="13" fill="rgba(255,255,255,.72)">and one ask for your partner.</text><circle cx="830" cy="253" r="9" fill="#ff6f5e"/><circle cx="830" cy="253" r="14" fill="none" stroke="#ff6f5e" stroke-opacity=".28" stroke-width="2"/><text x="854" y="258" font-size="12" font-weight="700" letter-spacing="1.8" fill="#ff6f5e">MON AUG 31</text><rect x="812" y="300" width="352" height="600" rx="22" fill="#141416" stroke="rgba(255,255,255,.09)"/><text x="838" y="342" font-size="11.5" font-weight="700" letter-spacing="2" fill="#ff6f5e">WEEK 3 &#183; MOVE</text><text x="838" y="388" font-size="36" font-weight="700" letter-spacing="-1.6" fill="#fff">Hot seats</text><rect x="838" y="410" width="300" height="1" fill="rgba(255,255,255,.1)"/><text x="838" y="442" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">GOAL</text><text x="838" y="468" font-size="15.5" fill="#fff">Break the single biggest blocker</text><text x="838" y="491" font-size="15.5" fill="#fff">standing in your way.</text><text x="838" y="536" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">OBJECTIVES</text><circle cx="841" cy="557" r="2.6" fill="#ff6f5e" opacity=".85"/><text x="854" y="562" font-size="13.5" fill="rgba(255,255,255,.66)">Three 20-minute hot seats,</text><text x="854" y="581" font-size="13.5" fill="rgba(255,255,255,.66)">eight operators per problem</text><circle cx="841" cy="605" r="2.6" fill="#ff6f5e" opacity=".85"/><text x="854" y="610" font-size="13.5" fill="rgba(255,255,255,.66)">Five minutes framing,</text><text x="854" y="629" font-size="13.5" fill="rgba(255,255,255,.66)">fifteen minutes the room solves</text><circle cx="841" cy="653" r="2.6" fill="#ff6f5e" opacity=".85"/><text x="854" y="658" font-size="13.5" fill="rgba(255,255,255,.66)">Deliver what you built for</text><text x="854" y="677" font-size="13.5" fill="rgba(255,255,255,.66)">your Week 2 partner</text><rect x="838" y="726" width="300" height="146" rx="14" fill="rgba(255,255,255,.045)"/><rect x="838" y="726" width="3" height="146" rx="1.5" fill="#ff6f5e"/><text x="856" y="754" font-size="10.5" font-weight="700" letter-spacing="2" fill="#ff6f5e">PREP</text><text x="856" y="778" font-size="13" fill="rgba(255,255,255,.72)">Flag a hot seat in your ship report.</text><text x="856" y="798" font-size="13" fill="rgba(255,255,255,.72)">Frame the problem in two</text><text x="856" y="818" font-size="13" fill="rgba(255,255,255,.72)">sentences, with the numbers</text><text x="856" y="838" font-size="13" fill="rgba(255,255,255,.72)">behind it.</text><circle cx="1206" cy="253" r="9" fill="#30d158"/><circle cx="1206" cy="253" r="14" fill="none" stroke="#30d158" stroke-opacity=".28" stroke-width="2"/><text x="1230" y="258" font-size="12" font-weight="700" letter-spacing="1.8" fill="#30d158">MON SEP 7</text><rect x="1188" y="300" width="352" height="600" rx="22" fill="#141416" stroke="rgba(255,255,255,.09)"/><text x="1214" y="342" font-size="11.5" font-weight="700" letter-spacing="2" fill="#30d158">WEEK 4 &#183; MEASURE</text><text x="1214" y="388" font-size="36" font-weight="700" letter-spacing="-1.6" fill="#fff">Results</text><rect x="1214" y="410" width="300" height="1" fill="rgba(255,255,255,.1)"/><text x="1214" y="442" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">GOAL</text><text x="1214" y="468" font-size="15.5" fill="#fff">Measure what moved and lock in</text><text x="1214" y="491" font-size="15.5" fill="#fff">the cadence that keeps it moving.</text><text x="1214" y="536" font-size="10.5" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,.38)">OBJECTIVES</text><circle cx="1217" cy="557" r="2.6" fill="#30d158" opacity=".85"/><text x="1230" y="562" font-size="13.5" fill="rgba(255,255,255,.66)">Six minutes each: commitment</text><text x="1230" y="581" font-size="13.5" fill="rgba(255,255,255,.66)">versus where the number landed</text><circle cx="1217" cy="605" r="2.6" fill="#30d158" opacity=".85"/><text x="1230" y="610" font-size="13.5" fill="rgba(255,255,255,.66)">Honest post-mortem on</text><text x="1230" y="629" font-size="13.5" fill="rgba(255,255,255,.66)">what did not ship</text><circle cx="1217" cy="653" r="2.6" fill="#30d158" opacity=".85"/><text x="1230" y="658" font-size="13.5" fill="rgba(255,255,255,.66)">Leave with a partner and</text><text x="1230" y="677" font-size="13.5" fill="rgba(255,255,255,.66)">a standing cadence</text><rect x="1214" y="726" width="300" height="146" rx="14" fill="rgba(255,255,255,.045)"/><rect x="1214" y="726" width="3" height="146" rx="1.5" fill="#30d158"/><text x="1232" y="754" font-size="10.5" font-weight="700" letter-spacing="2" fill="#30d158">PREP</text><text x="1232" y="778" font-size="13" fill="rgba(255,255,255,.72)">Final ship report.</text><text x="1232" y="798" font-size="13" fill="rgba(255,255,255,.72)">Pull the real numbers for your</text><text x="1232" y="818" font-size="13" fill="rgba(255,255,255,.72)">metric &#8212; then and now.</text><text x="60" y="936" font-size="14" fill="rgba(255,255,255,.4)">The room is the product.</text><text x="1540" y="936" font-size="14" fill="rgba(255,255,255,.4)" text-anchor="end">Ship report every Friday &#183; blockers in Slack the day they appear</text></svg>