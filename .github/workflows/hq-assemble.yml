name: hq-assemble
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hq-assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap HQ payload and verify
        run: |
          python3 - <<'PY'
          import re, hashlib, sys
          EXPECT = "d1e88755b0a9d263c37be8ae506091befd0534c02f8d390948020244446bcc17"
          p = "dashboard/index.html"
          s = open(p, encoding="utf-8").read()
          new_blob = open(".hqblob0", encoding="utf-8").read() + open(".hqblob1", encoding="utf-8").read()
          pat = r'"staticryptEncryptedMsgUniqueVariableName":"[0-9a-f]+"'
          hits = re.findall(pat, s)
          assert len(hits) == 1, "expected exactly one payload, found %d" % len(hits)
          out = re.sub(pat, '"staticryptEncryptedMsgUniqueVariableName":"' + new_blob + '"', s, count=1)
          got = hashlib.sha256(out.encode("utf-8")).hexdigest()
          if got != EXPECT:
              sys.exit("sha256 mismatch: got %s want %s -- refusing to write" % (got, EXPECT))
          open(p, "w", encoding="utf-8").write(out)
          print("assembled ok, sha256", got)
          PY
      - name: Clean up and commit
        run: |
          rm -f .hqblob0 .hqblob1 .github/workflows/hq-assemble.yml
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "hq: add Run the week card linking /dashboard/week/"
          git push
