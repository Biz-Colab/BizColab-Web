name: six-facilitator-copy-fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply copy fixes
        run: |
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          pairs=[
            ('<h3 id="bizcHeadline"><span>Seven people</span> in your corner.','<h3 id="bizcHeadline"><span>Six people</span> in your corner.'),
            ('The idea is straightforward. Six operators, one focused month.','The idea is straightforward. Six operators and one facilitator, one focused month.'),
            ('"text": "Six is the largest room where every voice still has weight','"text": "Every cohort is six operators plus one facilitator \\u2014 seven people in the room. Six is the largest room where every voice still has weight'),
            ('<div class="faq-body">Six is the largest room where every voice still has weight','<div class="faq-body">Every cohort is six operators plus one facilitator &mdash; seven people in the room. Six is the largest room where every voice still has weight'),
            ('curated cohort of eight business-minded operators','curated cohort of six business-minded operators'),
            ('One curated group of eight.','One curated group of six.'),
            ('in eight active businesses','in six active businesses'),
          ]
          for o,n in pairs:
              assert s.count(o)==1, (o[:50], s.count(o))
              s=s.replace(o,n)
          open(p,'w',encoding='utf-8').write(s)
          print('patched')
          PY
          rm -f .github/workflows/six-facilitator.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'index: six operators plus one facilitator; fix stale seven/eight copy'
          git push
